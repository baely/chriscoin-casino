# Builds the casino state page from the ledger and deploys it to GitHub Pages.
name: Deploy casino page to Pages

on:
  push:
    branches: ["main"]
  # Ledger merges use GITHUB_TOKEN, which never triggers push workflows, so
  # rebuild after every casino run as well.
  workflow_run:
    workflows: ["Casino ledger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      # Most scheduled casino runs merge nothing; only redeploy when main moved.
      - name: Check for ledger changes
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ] && [ "$(git rev-parse HEAD)" = "$RUN_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.changed.outputs.deploy == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Build casino page
        if: steps.changed.outputs.deploy == 'true'
        run: go run ./cmd/casino site --out _site --commit "$(git rev-parse HEAD)"
      - name: Setup Pages
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.changed.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

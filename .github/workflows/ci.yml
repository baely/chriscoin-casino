name: Validate casino

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - ledger/events.jsonl

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/casino validate
      - name: Check append-only ledger against pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:ledger/events.jsonl" > "$RUNNER_TEMP/base-ledger.jsonl"
          go run ./cmd/casino validate --base-ledger "$RUNNER_TEMP/base-ledger.jsonl"
